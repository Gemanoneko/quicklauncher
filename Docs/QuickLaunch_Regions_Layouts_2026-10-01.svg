<text x="730" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8aa0b8" text-anchor="start"  >Radius R: smallest value (2 px steps), at least 96,</text>
<text x="730" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8aa0b8" text-anchor="start"  >   with no two hit squares closer than g</text>
<text x="730" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8aa0b8" text-anchor="start"  >Fan pitch = min(180/(n-1), 60); R never shrinks as n grows</text>
<text x="730" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8aa0b8" text-anchor="start"  >Box margin 8. Fan box ends 56 below the pivot (hub lower half)</text>
<text x="730" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8aa0b8" text-anchor="start"  >Edit bar: Grid labelled (as today); others icon cluster</text>
