<text x="730" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8aa0b8" text-anchor="start"  >Tile hit square T = icon + 12 = 76</text>
<text x="730" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8aa0b8" text-anchor="start"  >Gap between hit squares g = 6</text>
<text x="730" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8aa0b8" text-anchor="start"  >Hub radius 48 (diameter 96), a circle in every theme</text>
<text x="730" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#8aa0b8" text-anchor="start"  >Fan/Ring tiles show no label; the hub shows the</text>
