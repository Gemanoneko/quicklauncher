<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'">
  <title>QuickLauncher</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles/base.css">
  <link id="theme-stylesheet" rel="stylesheet" href="styles/themes/cyberpunk.css">
  <!-- Region window rules (rim, handle, active border); after the theme so they win. -->
  <link rel="stylesheet" href="styles/region.css">
</head>
<body>
  <div id="app">
    <div id="app-entrance"></div>
    <div id="particles"></div>

    <!-- Header bar (draggable) -->
    <div id="header">
      <div id="title-area">
        <span id="region-icon" aria-hidden="true"></span>
        <span id="title">QUICK<span class="accent">.</span>LAUNCH</span>
        <!-- Row: a notice takes the name's line for 5 s (regions spec 2.4, 7.5). -->
        <span id="lead-notice"></span>
        <span id="header-version"></span>
      </div>
      <div id="filter-chip" class="hidden" title="Type to filter — Esc to clear">
        <span id="filter-chip-text"></span>
        <button id="filter-chip-clear" type="button" title="Clear filter">✕</button>
      </div>
      <div id="header-controls">
        <button id="btn-random-theme" title="Random theme for this region" aria-label="Random theme for this region">⚄</button>
        <button id="btn-settings" title="Settings" aria-label="Settings">⚙</button>
        <button id="btn-hide" title="Hide all regions to tray" aria-label="Hide all regions to tray">╌</button>
        <button id="btn-region-menu" title="Region menu" aria-label="Region menu">⋯</button>
      </div>
    </div>

    <!-- Main grid -->
    <div id="grid-container">
      <div id="drop-hint" class="hidden">
        <div class="drop-hint-inner">
          <div class="drop-icon">⊕</div>
          <div>DROP SHORTCUTS HERE</div>
          <div class="hint-sub">Drag them off the desktop, or right-click to add.</div>
        </div>
      </div>
      <div id="app-grid"></div>
    </div>

    <!-- Theme flavor banner -->
    <div id="theme-banner">
      <span id="theme-banner-text"></span>
    </div>

    <!-- Edit mode bottom bar -->
    <div id="edit-bar" class="hidden">
      <span class="edit-label edit-label-long">// EDIT MODE</span>
      <div class="edit-actions">
        <button id="btn-add-edit">+ FILE</button>
        <button id="btn-add-installed">+ INSTALLED</button>
        <button id="btn-done-edit">DONE</button>
      </div>
      <!-- Column and Row: the edit cluster (regions spec 5.6, 9.1); Row also shows EDIT. -->
      <span class="edit-label edit-label-short">EDIT</span>
      <div class="edit-cluster" role="group" aria-label="Edit">
        <button id="btn-cluster-add" type="button" title="Add a file or shortcut" aria-label="Add a file or shortcut">+</button>
        <button id="btn-cluster-installed" type="button" title="Add an installed app" aria-label="Add an installed app">⊞</button>
        <button id="btn-cluster-done" type="button" title="Finish editing" aria-label="Finish editing">✓</button>
      </div>
    </div>

    <!-- Update banner (hidden by default) -->
    <div id="update-banner" class="hidden">
      <span id="update-text"></span>
      <div id="update-actions"></div>
    </div>

  </div>

  <script src="region-icons.js"></script>
  <script src="banner-layers.js"></script>
  <script src="radial-layout.js"></script>
  <script src="theme-names.js"></script>
  <script src="app.js"></script>
  <script src="tile-order.js"></script>
  <script src="region.js"></script>
  <script src="header-art-safety.js"></script>
</body>
</html>
